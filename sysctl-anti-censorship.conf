# /etc/sysctl.d/99-anti-censorship.conf
# Universal Linux Network Performance & Congestion Tuning
# Compatible with Ubuntu, Debian, CentOS, RHEL, Rocky Linux, AlmaLinux, Arch Linux, Alpine

# 1. Enable BBR Congestion Control & Fair Queuing (fq)
# Drastically improves throughput and reduces packet loss stalling on lossy / censored international paths
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 2. Kernel IP Forwarding (Required for VPN & Docker packet routing)
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# 3. Enlarge UDP Receive & Send Socket Buffers
# Prevents packet drops during UDP bursts (critical for AmneziaWG, WireGuard, and Hysteria 2)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144

# 4. Enlarge TCP Buffer Windows
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# 5. Connection Tracking (Conntrack) Scaling
# Prevents conntrack table exhaustion under high concurrency / multiple Docker services
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_tcp_timeout_established = 28800

# 6. Reverse Path Filtering (Avoid packet drops on multi-homed or policy-routed interfaces)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
