[Interface]
# Client IPv4 address assigned by server
Address = 10.13.13.2/24

# Set DNS to Google / Cloudflare (prevents DNS-over-TLS DoT mobile deadlocks)
DNS = 8.8.8.8, 8.8.4.4, 1.1.1.1

# Critical: 1200 MTU guarantees zero IP packet fragmentation across cellular LTE/4G GTP-U encapsulation
MTU = 1200

# --- AmneziaWG Obfuscation Parameters (Tuned for Iran DPI bypass) ---
Jc = 4
Jmin = 40
Jmax = 70
S1 = 50
S2 = 50

# Single 32-bit integers for 100% compatibility with WG Tunnel on Android
H1 = 234186206
H2 = 969072416
H3 = 1204011079
H4 = 2067328887

# Client Curve25519 Private Key (Auto-generated in /opt/amneziawg/client_private_key.txt on server)
PrivateKey = <YOUR_CLIENT_PRIVATE_KEY>

[Peer]
# VPS Public IP and Port
# Recommended: Port 443 (UDP / QUIC masquerade). Also supported: 8443, 53, 51820
Endpoint = YOUR_SERVER_IP:443

# CRITICAL FIX FOR MOBILE CLIENTS:
# Removed '::/0' to prevent Android VpnService routing blackhole
AllowedIPs = 0.0.0.0/0

# Server Curve25519 Public Key (Auto-generated in /opt/amneziawg/server_public_key.txt on server)
PublicKey = <YOUR_SERVER_PUBLIC_KEY>

# Keepalive keeps the NAT mapping alive through carrier CGNAT timeouts
PersistentKeepalive = 25
